site_name: parsantic
site_url: https://elyase.github.io/parsantic
repo_url: https://github.com/elyase/parsantic
repo_name: elyase/parsantic

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - pymdownx.superfences
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_signature_annotations: true
            members_order: source
            docstring_style: google

nav:
  - Home: index.md
  - Benchmarks: benchmarks.md
  - API: api.md
